[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkmd"
version = "0.3.0"
description = "Pure-Python markdown to PDF compiler. Zero system dependencies. Deterministic."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Dylan Moir" },
]
keywords = ["markdown", "pdf", "compiler", "deterministic", "zero-dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Printing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "coverage[toml]>=7"]

[project.scripts]
inkmd = "inkmd.cli:main"

[project.urls]
Homepage = "https://github.com/eagredev/inkmd"
Repository = "https://github.com/eagredev/inkmd"
Issues = "https://github.com/eagredev/inkmd/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inkmd = ["py.typed", "assets/emoji/NotoColorEmoji.ttf", "assets/emoji/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# Dev-only coverage config. Does NOT affect the shipped package: `coverage`
# lives in the `dev` optional-dependencies group, never in runtime
# `dependencies`. Branch coverage is on because the block parser is
# branch-dense and line coverage would overstate how much of it is exercised.
# Run with: coverage run --branch -m pytest && coverage report -m
[tool.coverage.run]
branch = true
source = ["inkmd"]

[tool.coverage.report]
show_missing = true
