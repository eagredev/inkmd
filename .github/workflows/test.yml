name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests
        run: python -m pytest tests/ --ignore=tests/conformance -q

      - name: Run CommonMark conformance suite (informational)
        run: python tests/conformance/run_commonmark.py | tail -20
        continue-on-error: true

      - name: Run GFM extensions conformance suite (informational)
        run: python tests/conformance/run_gfm.py --extensions-only | tail -20
        continue-on-error: true
